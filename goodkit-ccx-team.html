<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCX Team</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap">
<style>
  :root {
    --bg: #f7f7f5; --bg2: #ffffff; --fg: #0a0a0a; --fg2: #555550;
    --accent: #FF5C1A; --accent2: #1A6FFF; --border: #e0e0da;
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; }

  .page { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }

  .brand-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 28px; }
  .wordmark { font-size: 20px; font-weight: 900; letter-spacing: -0.03em; text-decoration: none; color: var(--fg); }
  .wordmark span { color: var(--accent); }
  .sub-label { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg2); border-left: 2px solid var(--border); padding-left: 8px; }

  /* Loading / error */
  .center-state { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50vh; gap: 12px; color: var(--fg2); font-size: 14px; text-align: center; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Team hero */
  .team-hero { margin-bottom: 28px; }
  .team-school { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--fg2); margin-bottom: 4px; }
  .team-name { font-size: clamp(24px, 5vw, 36px); font-weight: 900; letter-spacing: -0.03em; line-height: 1.1; margin-bottom: 12px; }
  .team-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .code-pill { background: var(--fg); color: var(--bg); font-size: 12px; font-weight: 700; letter-spacing: 0.1em; padding: 5px 12px; border-radius: 5px; }
  .ccx-pill { background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 5px 10px; border-radius: 5px; }
  .meta-text { font-size: 13px; color: var(--fg2); }

  /* Stats */
  .stats { display: flex; gap: 10px; margin-bottom: 28px; flex-wrap: wrap; }
  .stat { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; flex: 1; min-width: 100px; }
  .stat-n { font-size: 22px; font-weight: 900; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .stat-n.orange { color: var(--accent); }
  .stat-n.blue { color: var(--accent2); }
  .stat-l { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg2); margin-top: 3px; }

  /* CTA band */
  .cta-band { background: var(--fg); color: var(--bg); border-radius: 12px; padding: 18px 22px; margin-bottom: 28px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .cta-band-text { font-size: 14px; font-weight: 600; line-height: 1.5; }
  .cta-band-text span { color: var(--accent); }
  .cta-btn { background: var(--accent); color: #fff; border: none; border-radius: 7px; padding: 10px 18px; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; white-space: nowrap; text-decoration: none; display: inline-block; transition: opacity .15s; }
  .cta-btn:hover { opacity: .85; }

  /* Listings grid */
  .section-head { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg2); margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; text-decoration: none; color: inherit; transition: box-shadow .15s; display: block; }
  .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.08); }
  .card-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: var(--bg); display: block; }
  .card-img-placeholder { width: 100%; aspect-ratio: 4/3; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 32px; color: var(--border); }
  .card-body { padding: 12px 14px; }
  .card-cat { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg2); margin-bottom: 3px; }
  .card-title { font-size: 14px; font-weight: 700; line-height: 1.3; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-bottom { display: flex; justify-content: space-between; align-items: baseline; }
  .card-price { font-size: 16px; font-weight: 900; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .card-cond { font-size: 11px; color: var(--fg2); font-weight: 500; }

  .empty-grid { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 36px; text-align: center; color: var(--fg2); font-size: 14px; line-height: 1.6; }
  .empty-grid a { color: var(--accent); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="page">
  <div class="brand-row">
    <a href="/" class="wordmark">goodkit<span>.</span></a>
    <span class="sub-label">CCX Program</span>
  </div>

  <div id="loadingState" class="center-state">
    <div class="spinner"></div>
    <span>Loading team page…</span>
  </div>

  <div id="errorState" class="center-state" style="display:none;">
    <div style="font-size:32px;">🚴</div>
    <strong>Team not found</strong>
    <span>That CCX code doesn't exist or is no longer active.</span>
    <a href="/ccx" style="color:var(--accent);font-weight:600;text-decoration:none;margin-top:4px;">Register your team →</a>
  </div>

  <div id="teamContent" style="display:none;">
    <div class="team-hero">
      <div class="team-school" id="teamSchool"></div>
      <div class="team-name" id="teamName"></div>
      <div class="team-meta">
        <span class="ccx-pill">CCX</span>
        <span class="code-pill" id="teamCode"></span>
        <span class="meta-text" id="teamSince"></span>
      </div>
    </div>

    <div class="stats" id="statsRow"></div>

    <div class="cta-band">
      <div class="cta-band-text">
        Got gear to sell? Add your team code <span id="ctaCode"></span> at listing.<br>
        <span style="font-weight:400;font-size:13px;color:#aaa;">2% of your sale goes straight to the team fund — automatically.</span>
      </div>
      <a href="/sell" class="cta-btn">List your gear →</a>
    </div>

    <div class="section-head" id="listingsHead">Gear for sale</div>
    <div class="grid" id="listingsGrid"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const fmt = cents => '$' + (cents / 100).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
const fmtDec = cents => '$' + (cents / 100).toFixed(2);

function teamSince(str) {
  if (!str) return '';
  const d = new Date(str);
  return 'Active since ' + d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
}

function condLabel(c) {
  return { excellent: 'Excellent', good: 'Good', fair: 'Fair', like_new: 'Like new' }[c] || c || '';
}

function renderListings(listings) {
  const grid = $('listingsGrid');
  $('listingsHead').textContent = `Gear for sale (${listings.length})`;

  if (!listings.length) {
    grid.innerHTML = `<div class="empty-grid">No listings yet.<br>Be the first — <a href="/sell">list your gear</a> with your team code.</div>`;
    return;
  }

  grid.innerHTML = listings.map(l => {
    const photo = l.photos?.[0];
    const imgEl = photo
      ? `<img class="card-img" src="${photo}" alt="${l.title}" loading="lazy">`
      : `<div class="card-img-placeholder">🚴</div>`;
    const total = l.price + (l.shipping || 0);
    return `
      <a class="card" href="/listing/${l.id}">
        ${imgEl}
        <div class="card-body">
          <div class="card-cat">${l.category || 'Gear'}</div>
          <div class="card-title">${l.title}</div>
          <div class="card-bottom">
            <span class="card-price">${fmt(total)}</span>
            <span class="card-cond">${condLabel(l.condition)}</span>
          </div>
        </div>
      </a>`;
  }).join('');
}

async function load() {
  // Extract code from URL: /ccx/teams/ABCDEF
  const code = location.pathname.split('/').pop().toUpperCase();
  if (!code || code.length !== 6) {
    $('loadingState').style.display = 'none';
    $('errorState').style.display = 'flex';
    return;
  }

  try {
    const res = await fetch(`/ccx/teams/${code}/data`);
    if (!res.ok) throw new Error('not found');
    const data = await res.json();
    if (!data.success) throw new Error(data.error);

    const t = data.team;

    // Update page title
    document.title = `${t.team_name} — GoodKit CCX`;

    $('teamSchool').textContent = t.school;
    $('teamName').textContent   = t.team_name;
    $('teamCode').textContent   = t.code;
    $('teamSince').textContent  = teamSince(t.created_at);
    $('ctaCode').textContent    = t.code;

    // Stats
    $('statsRow').innerHTML = `
      <div class="stat"><div class="stat-n orange">${data.listings.length}</div><div class="stat-l">Items for sale</div></div>
      <div class="stat"><div class="stat-n blue">${data.sales_count}</div><div class="stat-l">Items sold</div></div>
      <div class="stat"><div class="stat-n">${fmt(t.total_earned || 0)}</div><div class="stat-l">Earned for team</div></div>
    `;

    renderListings(data.listings);

    $('loadingState').style.display = 'none';
    $('teamContent').style.display  = 'block';
  } catch(err) {
    $('loadingState').style.display = 'none';
    $('errorState').style.display = 'flex';
  }
}

load();
</script>
</body>
</html>
